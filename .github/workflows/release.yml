name: Build and release

# tag 推送触发完整构建并发布 release；PR 只构建不发布；
# workflow_dispatch 可手动指定 CUDA 架构重新出包。
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA arch for the Linux CUDA build (sm_120a = Blackwell, sm_121 = DGX Spark, sm_89 = Ada)'
        required: false
        default: 'sm_120a'

permissions:
  contents: write

jobs:
  linux-cuda:
    name: Linux x86_64 (CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          # 只取编译与链接需要的部分：nvcc 加运行时与 cuBLAS。
          sub-packages: '["nvcc", "cudart", "cudart-dev", "libcublas", "libcublas-dev"]'

      - name: Show toolkit
        run: |
          echo "CUDA_HOME=${CUDA_HOME:-$(dirname "$(dirname "$(command -v nvcc)")")}"
          nvcc --version

      - name: Build
        # -march=x86-64-v2 而不是默认的原生：发布出去的二进制要能在别的机器上跑。
        # 核心代码不直接用 SIMD intrinsics，靠编译器自动向量化，降档后仍然正确。
        # -j2 而不是核数：nvcc 编这几个大文件单个就要几 GB，runner 只有 16 GB。
        run: |
          make -j2 cuda \
            CUDA_ARCH='${{ github.event.inputs.cuda_arch || 'sm_120a' }}' \
            NATIVE_CPU_FLAG='-march=x86-64-v2 -mtune=generic'

      - name: Package
        run: |
          arch='${{ github.event.inputs.cuda_arch || 'sm_120a' }}'
          name="ds4-${GITHUB_REF_NAME}-linux-x86_64-cuda-${arch}"
          mkdir -p "dist/$name"
          cp ds4 ds4-server ds4-bench ds4-eval ds4-agent "dist/$name/"
          cp README.md LICENSE changelog.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: '*.tar.gz'

  linux-cpu:
    name: Linux x86_64 (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make -j"$(nproc)" cpu \
            NATIVE_CPU_FLAG='-march=x86-64-v2 -mtune=generic'

      - name: Package
        run: |
          name="ds4-${GITHUB_REF_NAME}-linux-x86_64-cpu"
          mkdir -p "dist/$name"
          cp ds4 ds4-server ds4-bench ds4-eval ds4-agent "dist/$name/"
          cp README.md LICENSE changelog.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cpu
          path: '*.tar.gz'

  windows-cpu:
    name: Windows x86_64 (CPU-only, experimental)
    # 这个 job 允许失败：仓库目前没有 Windows 支持，源码依赖一批 POSIX 接口，
    # 缺一个真正的兼容层。放在这里是让 CI 持续暴露真实的编译错误清单，
    # 作为后续移植的输入；它失败时不影响 Linux 产物发布。
    # 移植清单见 changelog 的「Windows 构建状态」条目。
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build
        shell: msys2 {0}
        run: |
          make -j"$(nproc)" cpu \
            NATIVE_CPU_FLAG='-march=x86-64-v2 -mtune=generic'

      - name: Package
        shell: msys2 {0}
        run: |
          name="ds4-${GITHUB_REF_NAME}-windows-x86_64-cpu"
          mkdir -p "dist/$name"
          cp ds4.exe ds4-server.exe ds4-bench.exe ds4-eval.exe ds4-agent.exe "dist/$name/" 2>/dev/null || \
            cp ds4*.exe "dist/$name/"
          cp README.md LICENSE changelog.md "dist/$name/"
          (cd dist && zip -r "../$name.zip" "$name")

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu
          path: '*.zip'

  release:
    name: Publish release
    needs: [linux-cuda, linux-cpu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach everything that built
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Linux x86_64 构建由 CI 产出：`cuda` 版带本 fork 在 CUDA SSD 流式上的全部优化
            （专家预取并行化、内存常驻专家池、读透式主机专家缓存），`cpu` 版不含 GPU 后端。

            Windows 构建当前是实验性的：源码还没有 Windows 兼容层，这一版很可能没有
            `windows` 产物。缺什么看 CI 日志，清单记在 `changelog.md`。
